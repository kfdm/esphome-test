# http://homeassistant.local:8123/config/devices/device/71d66aeb66f4d940ddac0cee7438d768
esphome:
  name: m5stack-atom-washroom
  friendly_name: Washroom

packages:
  base: !include common/base.yaml
  atom: !include common/atom.yaml

# https://esphome.io/components/esp32_ble_beacon.html
esp32_ble_beacon:
  type: iBeacon
  uuid: 43271eec-ec0a-72ac-0500-ad0121ffd43e
  major: 1 # Apartment
  minor: 5 # Washroom

sensor:
  # https://docs.m5stack.com/en/unit/co2
  # https://esphome.io/components/sensor/scd4x.html
  - platform: scd4x
    address: 0x62
    update_interval: 60s
    co2:
      id: co2
      name: "CO2"
    temperature:
      id: temperature
      name: "Temperature"
    humidity:
      id: humidity
      name: "Humidity"
