# https://docs.m5stack.com/en/core/atom_lite
esp32:
  board: m5stack-atom
  framework:
    type: arduino
i2c:
  sda: 26
  scl: 32
  scan: true

binary_sensor:
  # https://esphome.io/components/switch/gpio
  - platform: gpio
    pin:
      number: 39
      inverted: true
    id: button
    name: ${friendly_name} Button
    on_press:
      then:
        - light.toggle: status_led

light:
  # https://esphome.io/components/light/index.html
  - platform: fastled_clockless
    chipset: SK6812
    pin: 27
    num_leds: 1
    rgb_order: GRB
    id: status_led
    name: ${friendly_name} LED
    effects:
      - random:
      - flicker:
      - addressable_rainbow:
