# https://docs.m5stack.com/en/atom/atom_socket
# References
# https://github.com/athom-tech/athom-configs/blob/main/athom-smart-plug-v2.yaml
globals:
  - id: total_energy
    type: float
    restore_value: yes
    initial_value: "0.0"

uart:
  rx_pin: GPIO22
  baud_rate: 4800
  parity: EVEN

switch:
  - platform: gpio
    name: "Relay"
    pin: GPIO23
    id: relay
    restore_mode: ${relay_restore_mode}

sensor:
  # https://esphome.io/components/sensor/cse7766.html
  - platform: cse7766
    # sensor_update_interval: 2s
    current:
      name: "Curent"
      unit_of_measurement: A
      accuracy_decimals: 3
      filters:
        - throttle_average: ${update_interval}
    voltage:
      name: "Voltage"
      unit_of_measurement: V
      accuracy_decimals: 2
      filters:
        # Map from sensor -> measured value
        - throttle_average: ${update_interval}
        - calibrate_linear:
            - 0.0 -> 0.0
            - 500.0 -> 940.0

    power:
      name: "Power"
      unit_of_measurement: W
      accuracy_decimals: 2
      filters:
        # Map from sensor -> measured value
        - throttle_average: ${update_interval}
        - calibrate_linear:
            - 0.0 -> 0.0
            - 5000.0 -> 9400.0
    energy:
      name: "Energy"
      id: energy
      unit_of_measurement: kWh
      # internal: ${hide_energy_sensor}
      filters:
        - throttle: ${sensor_update_interval}
        # Multiplication factor from W to kW is 0.001
        - multiply: 0.001
      on_value:
        then:
          - lambda: |-
              static float previous_energy_value = 0.0;
              float current_energy_value = id(energy).state;
              id(total_energy) += current_energy_value - previous_energy_value;
              previous_energy_value = current_energy_value;
              id(total_energy_sensor).update();

  - platform: template
    name: "Total Energy"
    id: total_energy_sensor
    unit_of_measurement: kWh
    device_class: "energy"
    state_class: "total_increasing"
    icon: "mdi:lightning-bolt"
    accuracy_decimals: 3
    lambda: |-
      return id(total_energy);
    update_interval: ${sensor_update_interval}
