substitutions:
  devicename: m5stack-socket-a
  friendly_name: Socket A
  relay_restore_mode: RESTORE_DEFAULT_ON
  current_limit: "16"
  update_interval: 2s
  sensor_update_interval: 10s

esphome:
  name: $devicename

packages:
  base: !include common/base.yaml

# https://docs.m5stack.com/en/core/atom_lite
esp32:
  board: m5stack-atom
  framework:
    type: arduino
i2c:
  sda: 26
  scl: 32
  scan: true

binary_sensor:
  # https://esphome.io/components/switch/gpio
  - platform: gpio
    pin:
      number: 39
      inverted: true
    id: button
    name: ${friendly_name} Button
    on_press:
      then:
        - light.toggle: status_led

light:
  # https://esphome.io/components/light/index.html
  - platform: fastled_clockless
    chipset: SK6812
    pin: 27
    num_leds: 1
    rgb_order: GRB
    id: status_led
    name: ${friendly_name} LED
    effects:
      - random:
      - flicker:
      - addressable_rainbow:

# https://docs.m5stack.com/en/atom/atom_socket

uart:
  rx_pin: GPIO22
  baud_rate: 4800
  parity: EVEN

switch:
  - platform: gpio
    name: "${friendly_name} Switch"
    pin: GPIO23
    id: relay
    restore_mode: ${relay_restore_mode}

sensor:
  # https://esphome.io/components/sensor/cse7766.html
  - platform: cse7766
    # sensor_update_interval: 2s
    current:
      name: "${friendly_name} Curent"
      unit_of_measurement: A
      accuracy_decimals: 3
      filters:
        - throttle_average: ${update_interval}
    voltage:
      name: "${friendly_name} Voltage"
      unit_of_measurement: V
      accuracy_decimals: 2
      filters:
        # Map from sensor -> measured value
        - throttle_average: ${update_interval}
        - calibrate_linear:
            - 0.0 -> 0.0
            - 500.0 -> 940.0

    power:
      name: "${friendly_name} Power"
      unit_of_measurement: W
      accuracy_decimals: 2
      filters:
        # Map from sensor -> measured value
        - throttle_average: ${update_interval}
        - calibrate_linear:
            - 0.0 -> 0.0
            - 5000.0 -> 9400.0
