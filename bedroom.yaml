# http://homeassistant.local:8123/config/devices/device/a422af1bbe2ad8a5516aa8e870131b6c
esphome:
  name: m5stack-atom-bedroom
  friendly_name: Bedroom

packages:
  base: !include common/base.yaml
  atom: !include common/atom.yaml

# https://esphome.io/components/esp32_ble_beacon.html
esp32_ble_beacon:
  type: iBeacon
  uuid: 43271eec-ec0a-72ac-0500-ad0121ffd43e
  major: 1 # Apartment
  minor: 1 # Bedroom

sensor:
  # https://docs.m5stack.com/en/unit/co2
  # https://esphome.io/components/sensor/scd4x.html
  - platform: scd4x
    address: 0x62
    update_interval: 60s
    co2:
      id: co2
      name: "CO2"
    temperature:
      id: temperature
      name: "Temperature"
    humidity:
      id: humidity
      name: "Humidity"
  # https://docs.m5stack.com/en/unit/dlight
  # https://esphome.io/components/sensor/bh1750.html
  - platform: bh1750
    name: "Illuminance"
    address: 0x23
    update_interval: 60s
  # https://docs.m5stack.com/en/unit/bps
  # https://esphome.io/components/sensor/qmp6988.html
  - platform: qmp6988
    temperature:
      name: Temperature (Extra)"
      oversampling: 16x
    pressure:
      name: "Pressure"
      oversampling: 16x
    address: 0x70
