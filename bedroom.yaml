substitutions:
  devicename: m5stack-atom-bedroom
  friendly_name: Bedroom

esphome:
  name: $devicename

packages:
  base: !include common/base.yaml
  atom: !include common/atom.yaml

# https://esphome.io/components/esp32_ble_beacon.html
esp32_ble_beacon:
  type: iBeacon
  uuid: 43271eec-ec0a-72ac-0500-ad0121ffd43e
  major: 1 # Apartment
  minor: 1 # Bedroom

sensor:
  # https://docs.m5stack.com/en/unit/co2
  # https://esphome.io/components/sensor/scd4x.html
  - platform: scd4x
    address: 0x62
    update_interval: 60s
    co2:
      id: co2
      name: "${friendly_name} CO2"
    temperature:
      id: temperature
      name: "${friendly_name} Temperature"
    humidity:
      id: humidity
      name: "${friendly_name} Humidity"
  # https://docs.m5stack.com/en/unit/dlight
  # https://esphome.io/components/sensor/bh1750.html
  - platform: bh1750
    name: "${friendly_name} Illuminance"
    address: 0x23
    update_interval: 60s
  # https://docs.m5stack.com/en/unit/bps
  # https://esphome.io/components/sensor/qmp6988.html
  - platform: qmp6988
    temperature:
      name: ${friendly_name} Temperature (Extra)"
      oversampling: 16x
    pressure:
      name: "${friendly_name} Pressure"
      oversampling: 16x
    address: 0x70
