esphome:
  name: inkplate-calendar
  friendly_name: Calendar
  on_boot:
    priority: -100 # Runs late in the boot cycle for safety
    then:
      - delay: 15s # Gives Wi-Fi and SNTP time to connect
      - lambda: |-
          ESP_LOGI("STARTUP", "Forcing initial background image download...");
          id(django_bg_canvas).update();

packages:
  base: !include common/base.yaml

# https://soldered.com/product/inkplate-10-9-7-e-paper-board-copy/
# https://esphome.io/components/display/inkplate6.html
# https://esphome.io/components/esp32/
esp32:
  board: esp-wrover-kit
  cpu_frequency: "240MHz"
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "45"
      CONFIG_ESP_INT_WDT_TIMEOUT_MS: "5000"

switch:
  - platform: gpio
    id: battery_read_mosfet
    pin:
      pca6416a: pca6416a_hub
      number: 9

sensor:
  - platform: adc
    id: battery_voltage
    update_interval: never
    attenuation: 12db
    pin: 35
  - platform: template
    name: "Inkplate Battery Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    lambda: |-
      // Enable MOSFET to connect battery voltage divider
      id(battery_read_mosfet).turn_on();
      // Wait for voltage to stabilize
      delay(5);
      // Sample ADC value
      float adc = id(battery_voltage).sample();
      // Disable MOSFET to save power
      id(battery_read_mosfet).turn_off();
      return adc;
    filters:
      - multiply: 2 # Compensate for voltage divider (1:2 ratio)

# Fixed: Explicitly declared the Inkplate 10 native hardware I2C pins
i2c:
  sda: 21
  scl: 22

pca6416a:
  - id: pca6416a_hub
    address: 0x20
    # Primary expander for display control and additional I/O
  - id: pca6416a_hub2
    address: 0x21
    # Secondary expander for additional I/O

binary_sensor:
  - platform: status
    name: "Inkplate Status"
    id: system_status

time:
  - platform: sntp
    id: esptime
    on_time:
      - seconds: 0
        then:
          - lambda: |-
              ESP_LOGI("TIMER", "Refreshing display...");
              id(inkplate_display).update();
      - minutes: /30
        seconds: 10
        then:
          - lambda: |-
              ESP_LOGI("TIMER", "Fetching new background image...");
              id(django_bg_canvas).update();

font:
  - file: "gfonts://Helvetica"
    id: local_clock_font
    size: 96

psram:
  mode: quad
  speed: 80MHz

button:
  - platform: template
    name: "Refresh E-Paper Image"
    id: refresh_image_button
    icon: "mdi:refresh"
    on_press:
      then:
        - lambda: |-
            ESP_LOGI("REFRESH", "Clearing cache and triggering download...");
            id(django_bg_canvas).release();
            // Force the online_image component to download immediately
            id(django_bg_canvas).update();

globals:
  - id: remote_clock_pos_x
    type: int
    restore_value: no
    initial_value: "600"
  - id: remote_clock_pos_y
    type: int
    restore_value: no
    initial_value: "412"

http_request:
  useragent: esphome/inkplate10
  timeout: 15s

online_image:
  - url: !secret inkplate_background
    format: BMP
    type: BINARY
    id: django_bg_canvas
    # Fix the boot bug: Set update_interval to never and rely ONLY on your safe 15s boot trigger
    update_interval: never

display:
  - platform: inkplate
    id: inkplate_display
    greyscale: false
    partial_updating: false
    update_interval: never
    model: inkplate_10

    ckv_pin: 32
    sph_pin: 33
    gmod_pin:
      pca6416a: pca6416a_hub
      number: 1
    gpio0_enable_pin:
      pca6416a: pca6416a_hub
      number: 8
    oe_pin:
      pca6416a: pca6416a_hub
      number: 0
    spv_pin:
      pca6416a: pca6416a_hub
      number: 2
    powerup_pin:
      pca6416a: pca6416a_hub
      number: 4
    wakeup_pin:
      pca6416a: pca6416a_hub
      number: 3
    vcom_pin:
      pca6416a: pca6416a_hub
      number: 5

    lambda: |-
      // Check if the image has valid data allocated in memory
      if (id(django_bg_canvas).get_width() > 0) {
        it.image(0, 0, id(django_bg_canvas));
      } else {
        ESP_LOGW("DISPLAY", "Background image buffer is empty. Drawing clock only.");
      }

      // Draw the clock layer safely
      it.strftime(
        id(remote_clock_pos_x), 
        id(remote_clock_pos_y), 
        id(local_clock_font), 
        Color::BLACK, 
        TextAlign::CENTER, 
        "%H:%M", 
        id(esptime).now()
      );
