# http://homeassistant.local:8123/config/devices/device/f0b1f738cb977be61c245c8d0cbb09e0
esphome:
  name: m5stack-atom-guestroom
  friendly_name: Guestroom

packages:
  base: !include common/base.yaml
  atom: !include common/atom.yaml

# https://esphome.io/components/esp32_ble_beacon.html
esp32_ble_beacon:
  type: iBeacon
  uuid: 43271eec-ec0a-72ac-0500-ad0121ffd43e
  major: 1 # Apartment
  minor: 6 # Guestroom

sensor:
  # https://docs.m5stack.com/en/unit/co2
  # https://esphome.io/components/sensor/scd4x.html
  - platform: scd4x
    address: 0x62
    update_interval: 60s
    co2:
      id: co2
      name: "CO2"
    temperature:
      id: temperature
      name: "Temperature"
    humidity:
      id: humidity
      name: "Humidity"
